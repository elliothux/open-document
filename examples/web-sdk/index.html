<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Document SDK example</title>
  <style>
    body {
      margin: 20px;
      font:
        14px Arial,
        sans-serif;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    textarea {
      width: 300px;
      height: 50px;
    }
    #editor {
      height: 650px;
      border: 1px solid #ddd;
    }
  </style>
  <h1>Open Document — WIP SDK</h1>
  <form id="open-form">
    <label
      >Document<input
        id="document"
        type="file"
        accept=".docx,.xlsx,.csv,.tsv,.pptx,.pdf"
        required
    /></label>
    <label
      >Optional additional fonts<input
        id="fonts"
        type="file"
        accept=".ttf,.otf"
        multiple
    /></label>
    <label
      >Optional font overrides (font key → font filename without
      extension)<textarea id="profile">{}</textarea>
    </label>
    <label
      ><span>Host save callback</span
      ><span
        ><input id="host-save" type="checkbox" /> Save into a chosen
        folder</span
      ></label
    >
    <button type="submit">Mount editor</button>
    <button type="button" id="close">Close</button>
  </form>
  <p id="host-status" role="status">
    Choose a document. Bundled substitute fonts are available automatically;
    layout may differ. Files stay in this browser.
  </p>
  <div id="editor"></div>
  <script type="module">
    await import(`./dist/app.js?v=${Date.now()}`);
  </script>
</html>
