<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Document SDK example</title>
  <link rel="stylesheet" href="./example.css" />
  <h1>Open Document — WIP SDK</h1>
  <p>
    <a href="./headless.html">Worker example</a> ·
    <a href="./react.html">React example</a>
  </p>
  <form id="open-form">
    <label
      >Document<input
        id="document"
        type="file"
        accept=".docx,.xlsx,.csv,.tsv,.pptx,.pdf"
        required
    /></label>
    <label
      >Optional additional fonts<input
        id="fonts"
        type="file"
        accept=".ttf,.otf"
        multiple
    /></label>
    <label
      >Optional font overrides (font key → font filename without
      extension)<textarea id="profile">{}</textarea>
    </label>
    <label
      ><span>Host save callback</span
      ><span
        ><input id="host-save" type="checkbox" /> Save into a chosen
        folder</span
      ></label
    >
    <button type="submit">Mount editor</button>
    <button type="submit" id="open-sample" formnovalidate>Open sample</button>
    <button type="button" id="close">Close</button>
  </form>
  <p id="host-status" role="status">
    Choose a document. Bundled substitute fonts are available automatically;
    layout may differ. Files stay in this browser.
  </p>
  <div id="editor"></div>
  <script type="module" id="example-script" src="./dist/app.js"></script>
</html>
